name: Wire Supabase client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Supabase bootstrap to the static page
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="/supabase-init.js" defer></script>'

          if marker not in text:
              if '</head>' not in text:
                  raise SystemExit('index.html sem fechamento </head>')
              text = text.replace('</head>', f'{marker}\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Supabase bootstrap já conectado.')

      - name: Commit bootstrap when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: conectar bootstrap do Supabase"
          git push

name: Fix logo alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consolidate logo as one visual unit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_html = '<a class="logo" href="#top" aria-label="BET, CHEGA.">BET<span>,</span>CHEGA<span>.</span></a>'
          new_html = '<a class="logo" href="#top" aria-label="BET, CHEGA.">BET, CHEGA.</a>'
          s = s.replace(old_html, new_html, 1)
          old_css = '.logo{display:inline-flex;align-items:baseline;font-weight:950;font-size:25px;letter-spacing:-.055em;line-height:1;white-space:nowrap}.logo span{color:var(--lime);display:inline;margin:0}'
          new_css = '.logo{display:inline-flex;align-items:center;font-weight:950;font-size:25px;letter-spacing:-.055em;line-height:1;white-space:nowrap;transform:translateY(1px)}'
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'BET, CHEGA. Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: consolidar logo BET, CHEGA. como unidade'
          git push

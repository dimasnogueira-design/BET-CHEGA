name: Fix logo alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply surgical CSS fix
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='.logo{font-weight:900;letter-spacing:-.06em;font-size:24px}.logo span{color:var(--lime)}'; new='.logo{display:inline-flex;align-items:baseline;font-weight:900;font-size:24px;letter-spacing:-.035em;line-height:1;white-space:nowrap}.logo span{color:var(--lime);display:inline-block;margin-left:.02em}'; assert old in s, 'Expected logo CSS was not found'; p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Commit and push
        run: |
          git config user.name "BET, CHEGA. Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: alinhar logo BET, CHEGA."
          git push

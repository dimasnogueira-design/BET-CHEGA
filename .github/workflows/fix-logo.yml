name: Fix logo alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix logo as one typographic unit
        shell: bash
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='<a class=\"logo\" href=\"#top\" aria-label=\"BET, CHEGA.\">BET<span>,</span><span class=\"logo-word\">CHEGA</span><span>.</span></a>'; new='<a class=\"logo\" href=\"#top\" aria-label=\"BET, CHEGA.\">BET<span>,</span>CHEGA<span>.</span></a>'; s=s.replace(old,new,1); oldcss='.logo{display:inline-flex;align-items:baseline;font-weight:900;font-size:24px;letter-spacing:-.035em;line-height:1;white-space:nowrap}.logo span{color:var(--lime);display:inline-block;margin-left:.02em}'; newcss='.logo{display:inline-flex;align-items:baseline;font-weight:900;font-size:24px;letter-spacing:-.045em;line-height:1;white-space:nowrap}.logo span{color:var(--lime);display:inline;margin:0}'; assert oldcss in s, 'Logo CSS not found'; s=s.replace(oldcss,newcss,1); p.write_text(s,encoding='utf-8')"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "BET, CHEGA. Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: consolidar logo BET,CHEGA."
          git push

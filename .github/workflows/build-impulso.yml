name: Build Modo Impulso

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-impulso.yml'
      - 'scripts/build_impulso.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-impulso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar Modo Impulso
        run: python3 scripts/build_impulso.py

      - name: Validar
        run: |
          grep -q '<!-- MODO IMPULSO V1 -->' index.html
          grep -q 'href="#impulso"' index.html
          grep -q 'repirando.png' index.html
          grep -q 'remaining=30' index.html

      - name: Commit e push
        run: |
          git config user.name "BET, CHEGA. Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat: adicionar Modo Impulso com pausa de 30 segundos"
          git push
